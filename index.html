<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ASCII Holo-Tank | Digital Desk Aquarium</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #2a3132 0%, #15191a 100%);
      font-family: "Courier New", Courier, monospace;
      color: #6df7ff;
    }

    .desk-mat {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    body.fullscreen-mode .desk-mat,
    body.fullscreen-mode .stand-base,
    body.fullscreen-mode .stand-legs {
      display: none;
    }

    body.fullscreen-mode .prism-glass {
      width: 94vw;
      height: 82vh;
      border-radius: 16px;
    }

    .gadget-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      transform: translateY(-18px);
    }

    .prism-glass {
      position: relative;
      width: min(320px, 84vw);
      height: min(300px, 48vh);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(180, 235, 245, 0.05) 45%,
        rgba(255, 255, 255, 0.12) 100%
      );
      border-top: 3px solid rgba(255, 255, 255, 0.55);
      border-left: 3px solid rgba(255, 255, 255, 0.45);
      border-right: 2px solid rgba(255, 255, 255, 0.25);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      box-shadow:
        inset 6px 6px 16px rgba(255, 255, 255, 0.18),
        inset -6px -4px 14px rgba(0, 220, 255, 0.1),
        0 10px 30px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
    }

    .prism-reflection {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        115deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.04) 28%,
        transparent 30%,
        transparent 75%,
        rgba(255, 255, 255, 0.08) 100%
      );
      pointer-events: none;
      z-index: 5;
    }

    canvas#tankCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .stand-base {
      width: min(356px, 92vw);
      height: 76px;
      background: linear-gradient(180deg, #98bdb9 0%, #83a8a4 100%);
      border-radius: 8px;
      box-shadow:
        inset 0 2px 3px rgba(255, 255, 255, 0.45),
        inset 0 -4px 8px rgba(0, 0, 0, 0.2),
        0 14px 24px rgba(0, 0, 0, 0.5);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .stand-base::before {
      content: "";
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(35, 55, 53, 0.35);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .stand-legs {
      width: min(260px, 68vw);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .leg {
      width: 54px;
      height: 54px;
      background: linear-gradient(180deg, #799e9a 0%, #688b87 100%);
      border-radius: 0 0 6px 6px;
      box-shadow:
        inset 2px 0 3px rgba(255, 255, 255, 0.2),
        0 12px 18px rgba(0, 0, 0, 0.55);
    }

    .controls-bar {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(20, 28, 30, 0.82);
      border: 1px solid rgba(109, 247, 255, 0.28);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      z-index: 999;
      width: max-content;
      max-width: 95vw;
    }

    .btn {
      background: rgba(109, 247, 255, 0.12);
      color: #b8fbff;
      border: 1px solid rgba(109, 247, 255, 0.35);
      border-radius: 999px;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.93);
      background: rgba(109, 247, 255, 0.3);
    }

    .hint-text {
      position: fixed;
      top: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div class="desk-mat"></div>
  <div class="hint-text">Tap glass to feed · Double-tap to knock</div>

  <div class="gadget-wrapper">
    <div class="prism-glass" id="glassBox">
      <canvas id="tankCanvas"></canvas>
      <div class="prism-reflection"></div>
    </div>
    <div class="stand-base"></div>
    <div class="stand-legs">
      <div class="leg"></div>
      <div class="leg"></div>
    </div>
  </div>

  <div class="controls-bar">
    <button class="btn" id="btnFeed">Feed</button>
    <button class="btn" id="btnColor">Glow</button>
    <button class="btn" id="btnSound">SFX: ON</button>
    <button class="btn" id="btnMode">Full</button>
  </div>

  <script>
    const canvas = document.getElementById("tankCanvas");
    const ctx = canvas.getContext("2d");
    const glassBox = document.getElementById("glassBox");

    let soundEnabled = true;
    let audioCtx = null;

    const themes = [
      { fish: "#5ceeff", glow: "#00d9ff", weed: "#43f59b", bubble: "#9ff6ff", food: "#ffe66d" },
      { fish: "#6bff95", glow: "#1aff66", weed: "#29b677", bubble: "#b8ffd0", food: "#fff07c" },
      { fish: "#ffbe55", glow: "#ff9900", weed: "#5ce09b", bubble: "#ffe2b0", food: "#70f3ff" },
      { fish: "#ff7be5", glow: "#ff33cc", weed: "#4be8b0", bubble: "#ffc7f3", food: "#ffe66d" }
    ];
    let themeIndex = 0;

    const sprite = {
      right: "><(((°>",
      left: "<°)))><",
      happyRight: "><(((^>",
      happyLeft: "<^)))><"
    };

    let fish = null;
    let bubbles = [];
    let foods = [];
    let weeds = [];

    function resizeCanvas() {
      const rect = glassBox.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      initWeeds(rect.width, rect.height);
    }

    function initWeeds(w, h) {
      weeds = [];
      const count = Math.max(3, Math.floor(w / 75));
      for (let i = 0; i < count; i++) {
        weeds.push({
          x: (w / (count + 1)) * (i + 1) + (Math.random() - 0.5) * 18,
          segments: 4 + Math.floor(Math.random() * 3),
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function playBeep(freq = 620, duration = 0.06, type = "sine") {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function spawnBubble(x, y, char = null) {
      const chars = ["o", "°", "O", "."];
      bubbles.push({
        x: x + (Math.random() - 0.5) * 8,
        y: y,
        vy: 0.65 + Math.random() * 0.75,
        wobble: Math.random() * Math.PI * 2,
        char: char || chars[Math.floor(Math.random() * chars.length)]
      });
    }

    function dropFood(x, y) {
      const rect = glassBox.getBoundingClientRect();
      const foodChars = ["·", "*", "+", "•"];
      for (let i = 0; i < 3; i++) {
        foods.push({
          x: (x ?? rect.width * (0.25 + Math.random() * 0.5)) + (Math.random() - 0.5) * 20,
          y: (y ?? 24) + Math.random() * 10,
          vy: 0.35 + Math.random() * 0.25,
          char: foodChars[Math.floor(Math.random() * foodChars.length)]
        });
      }
      playBeep(540, 0.05, "triangle");
    }

    function bindSingleAction(element, callback, cooldown = 200) {
      let lastTrigger = 0;
      element.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const now = Date.now();
        if (now - lastTrigger < cooldown) return;
        lastTrigger = now;
        callback(e);
      });
    }

    bindSingleAction(document.getElementById("btnFeed"), () => dropFood(), 200);
    bindSingleAction(document.getElementById("btnColor"), () => {
      themeIndex = (themeIndex + 1) % themes.length;
      playBeep(660, 0.06, "sine");
    }, 200);
    bindSingleAction(document.getElementById("btnSound"), (e) => {
      soundEnabled = !soundEnabled;
      e.currentTarget.textContent = soundEnabled ? "SFX: ON" : "SFX: OFF";
      if (soundEnabled) playBeep(720, 0.06, "sine");
    }, 200);
    bindSingleAction(document.getElementById("btnMode"), (e) => {
      document.body.classList.toggle("fullscreen-mode");
      e.currentTarget.textContent = document.body.classList.contains("fullscreen-mode") ? "Stand" : "Full";
      setTimeout(resizeCanvas, 50);
    }, 250);

    let lastTapTime = 0;
    glassBox.addEventListener("pointerdown", (e) => {
      const rect = glassBox.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const now = Date.now();

      if (now - lastTapTime < 280) {
        fish.dir = fish.x < x ? -1 : 1;
        fish.vx = fish.dir * 2.1;
        spawnBubble(fish.x, fish.y - 6, "o");
        playBeep(920, 0.05, "square");
      } else {
        dropFood(x, y);
      }
      lastTapTime = now;
    });

    function updateAndDraw(time) {
      const rect = glassBox.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const theme = themes[themeIndex];

      ctx.clearRect(0, 0, w, h);

      // Draw seaweed
      ctx.save();
      ctx.font = "bold 16px 'Courier New', monospace";
      ctx.fillStyle = theme.weed;
      ctx.shadowColor = theme.weed;
      ctx.shadowBlur = 8;
      ctx.textAlign = "center";

      weeds.forEach((weed) => {
        for (let s = 0; s < weed.segments; s++) {
          const sway = Math.sin(time * 0.0022 + weed.phase + s * 0.7) * (2 + s * 0.8);
          const char = (s + Math.floor(time * 0.002)) % 2 === 0 ? "(" : ")";
          ctx.fillText(char, weed.x + sway, h - 10 - s * 14);
        }
      });
      ctx.restore();

      // Draw food pellets
      ctx.save();
      ctx.font = "bold 14px 'Courier New', monospace";
      ctx.fillStyle = theme.food;
      ctx.shadowColor = theme.food;
      ctx.shadowBlur = 6;
      ctx.textAlign = "center";

      for (let i = foods.length - 1; i >= 0; i--) {
        const fd = foods[i];
        fd.y += fd.vy;
        fd.x += Math.sin(time * 0.005 + i) * 0.2;
        ctx.fillText(fd.char, fd.x, fd.y);
        if (fd.y > h - 12) {
          foods.splice(i, 1);
        }
      }
      ctx.restore();

      // Update & draw single fish
      let targetFood = null;
      let minDist = 160;
      foods.forEach((fd) => {
        const d = Math.hypot(fd.x - fish.x, fd.y - fish.y);
        if (d < minDist) {
          minDist = d;
          targetFood = fd;
        }
      });

      if (targetFood) {
        const dx = targetFood.x - fish.x;
        const dy = targetFood.y - fish.y;
        fish.dir = dx >= 0 ? 1 : -1;
        fish.vx += (dx / (minDist || 1)) * 0.08;
        fish.vy += (dy / (minDist || 1)) * 0.06;
        fish.vx = Math.max(-1.8, Math.min(1.8, fish.vx));
        fish.vy = Math.max(-1.2, Math.min(1.2, fish.vy));

        if (minDist < 18) {
          const idx = foods.indexOf(targetFood);
          if (idx > -1) foods.splice(idx, 1);
          fish.happyTimer = 45;
          spawnBubble(fish.x + fish.dir * 12, fish.y - 6, "o");
          playBeep(860, 0.05, "sine");
        }
      } else {
        const targetSpeed = fish.dir * 0.75;
        fish.vx += (targetSpeed - fish.vx) * 0.03;
        fish.vy *= 0.96;
        if (Math.random() < 0.004) {
          fish.dir *= -1;
        }
      }

      fish.x += fish.vx;
      fish.y += fish.vy + Math.sin(time * 0.003) * 0.22;

      const margin = 46;
      if (fish.x < margin) {
        fish.x = margin;
        fish.dir = 1;
        fish.vx = Math.abs(fish.vx);
      } else if (fish.x > w - margin) {
        fish.x = w - margin;
        fish.dir = -1;
        fish.vx = -Math.abs(fish.vx);
      }

      if (fish.y < 32) fish.y = 32;
      if (fish.y > h - 42) fish.y = h - 42;

      if (Math.random() < 0.007) {
        spawnBubble(fish.x + fish.dir * 16, fish.y - 4);
      }

      if (fish.happyTimer > 0) fish.happyTimer--;

      const isHappy = fish.happyTimer > 0;
      const text =
        fish.dir === 1
          ? isHappy ? sprite.happyRight : sprite.right
          : isHappy ? sprite.happyLeft : sprite.left;

      ctx.save();
      ctx.font = "bold 17px 'Courier New', monospace";
      ctx.fillStyle = theme.fish;
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = 12;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, fish.x, fish.y);
      ctx.restore();

      // Update & draw bubbles
      ctx.save();
      ctx.font = "bold 13px 'Courier New', monospace";
      ctx.fillStyle = theme.bubble;
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = 8;
      ctx.textAlign = "center";

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y -= b.vy;
        b.x += Math.sin(time * 0.006 + b.wobble) * 0.35;
        ctx.fillText(b.char, b.x, b.y);
        if (b.y < 14) {
          bubbles.splice(i, 1);
        }
      }
      ctx.restore();

      requestAnimationFrame(updateAndDraw);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    const initRect = glassBox.getBoundingClientRect();
    fish = {
      x: initRect.width * 0.5,
      y: initRect.height * 0.45,
      vx: -0.75,
      vy: 0,
      dir: -1,
      happyTimer: 0
    };
    spawnBubble(initRect.width * 0.55, initRect.height * 0.35, "o");
    requestAnimationFrame(updateAndDraw);
  </script>
</body>
</html>
