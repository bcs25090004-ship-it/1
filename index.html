<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ASCII Holo-Tank | Digital Desk Aquarium</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", Courier, monospace;
      background: #1c2224;
      position: relative;
    }

    /* 工作室暖调木桌与深灰切割垫景深背景 */
    .studio-backdrop {
      position: fixed;
      inset: -20px;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(212, 175, 132, 0.32) 0%, rgba(110, 88, 66, 0.14) 38%, transparent 65%),
        radial-gradient(circle at 50% 62%, #363e40 0%, #1d2224 72%, #111416 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* 透视感切割垫网格与刻度线 */
    .cutting-mat {
      position: fixed;
      left: -15%;
      right: -15%;
      bottom: -8%;
      height: 64%;
      background-color: rgba(42, 48, 50, 0.85);
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.11) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.11) 1.5px, transparent 1.5px),
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 90px 90px, 90px 90px, 18px 18px, 18px 18px;
      border-top: 2px solid rgba(255, 255, 255, 0.16);
      transform: perspective(680px) rotateX(48deg);
      transform-origin: bottom center;
      box-shadow: inset 0 24px 50px rgba(0, 0, 0, 0.55);
      pointer-events: none;
      z-index: 1;
    }

    /* 桌面环境柔和暗角与散景光斑 */
    .ambient-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, transparent 45%, rgba(0, 0, 0, 0.58) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* 全屏纯享模式切换 */
    body.fullscreen-mode .cutting-mat,
    body.fullscreen-mode .stand-unit,
    body.fullscreen-mode .stand-shadow {
      display: none;
    }

    body.fullscreen-mode .prism-assembly {
      transform: translateY(-10px);
    }

    body.fullscreen-mode .prism-glass {
      width: min(92vw, 560px);
      height: min(74vh, 620px);
      border-radius: 16px;
    }

    /* 整体摆件容器 */
    .prism-assembly {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      transform: translateY(-20px);
      transition: transform 0.3s ease;
    }

    /* 3D 透明亚克力厚棱镜方块 */
    .prism-glass {
      position: relative;
      width: min(310px, 82vw);
      height: min(305px, 46vh);
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.16) 0%,
        rgba(170, 235, 248, 0.05) 38%,
        rgba(14, 24, 28, 0.38) 78%,
        rgba(255, 255, 255, 0.14) 100%
      );
      /* 模拟真实亚克力板厚度的多层高光与折射边 */
      border-top: 5px solid rgba(255, 255, 255, 0.62);
      border-left: 5px solid rgba(255, 255, 255, 0.45);
      border-right: 4px solid rgba(215, 245, 255, 0.34);
      border-bottom: none;
      border-radius: 7px 7px 0 0;
      box-shadow:
        inset 10px 10px 22px rgba(255, 255, 255, 0.2),
        inset -10px -8px 20px rgba(0, 215, 255, 0.12),
        inset 0 0 36px rgba(0, 185, 225, 0.08),
        0 14px 34px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* 玻璃内部斜向镜面反光与内部折射竖线 */
    .prism-reflection {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          118deg,
          rgba(255, 255, 255, 0.26) 0%,
          rgba(255, 255, 255, 0.07) 26%,
          transparent 28%,
          transparent 76%,
          rgba(255, 255, 255, 0.12) 100%
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.18) 0px,
          rgba(255, 255, 255, 0.18) 2px,
          transparent 2px,
          transparent calc(100% - 2px),
          rgba(255, 255, 255, 0.16) calc(100% - 2px)
        );
      pointer-events: none;
      z-index: 6;
    }

    /* 底座投射到玻璃底部的全息光源泛光 */
    .bottom-led-glow {
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: -8px;
      height: 24px;
      background: radial-gradient(ellipse at center, var(--led-color, rgba(0, 225, 255, 0.55)) 0%, transparent 72%);
      filter: blur(6px);
      pointer-events: none;
      z-index: 4;
    }

    canvas#tankCanvas {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 5;
    }

    /* 3D 打印莫兰迪薄荷绿底座组件 */
    .stand-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      position: relative;
      z-index: 12;
    }

    /* 底座顶盖 */
    .stand-lid {
      width: min(358px, 92vw);
      height: 18px;
      background: linear-gradient(180deg, #a7cbc7 0%, #92b7b3 100%);
      border-radius: 7px 7px 2px 2px;
      box-shadow:
        inset 0 2px 2px rgba(255, 255, 255, 0.55),
        0 2px 4px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    /* 底座插槽微光缝隙 */
    .stand-lid::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(312px, 82vw);
      height: 3px;
      background: var(--led-color, #4ef2ff);
      box-shadow: 0 0 10px var(--led-color, #4ef2ff);
      opacity: 0.85;
    }

    /* 底座主机身 */
    .stand-body {
      width: min(352px, 90vw);
      height: 62px;
      background: linear-gradient(180deg, #8bb0ac 0%, #789d99 100%);
      border-radius: 2px 2px 9px 9px;
      box-shadow:
        inset 0 3px 5px rgba(25, 42, 40, 0.28),
        inset 2px 0 3px rgba(255, 255, 255, 0.22),
        inset -2px 0 4px rgba(0, 0, 0, 0.18),
        0 14px 26px rgba(0, 0, 0, 0.52);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 18px;
    }

    /* 右侧状态指示微光小灯 */
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--led-color, #5ceeff);
      box-shadow: 0 0 8px var(--led-color, #5ceeff);
      opacity: 0.9;
    }

    /* 两条立体前支脚 */
    .stand-legs {
      width: min(256px, 66vw);
      display: flex;
      justify-content: space-between;
      margin-top: -1px;
    }

    .leg {
      width: 54px;
      height: 54px;
      background: linear-gradient(180deg, #779c98 0%, #638682 100%);
      border-radius: 0 0 7px 7px;
      box-shadow:
        inset 3px 0 4px rgba(255, 255, 255, 0.18),
        inset -3px 0 5px rgba(0, 0, 0, 0.22),
        0 14px 20px rgba(0, 0, 0, 0.6);
    }

    /* 桌面投影 */
    .stand-shadow {
      width: min(340px, 86vw);
      height: 22px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.68) 0%, transparent 72%);
      margin-top: -8px;
      pointer-events: none;
      z-index: 9;
    }

    /* 顶部极简提示文字 */
    .hint-text {
      position: fixed;
      top: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.52);
      letter-spacing: 0.6px;
      pointer-events: none;
      z-index: 20;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
    }

    /* 底部悬浮控制栏 */
    .controls-bar {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(18, 25, 27, 0.78);
      border: 1px solid rgba(109, 247, 255, 0.28);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      z-index: 999;
      width: max-content;
      max-width: 95vw;
    }

    .btn {
      background: rgba(109, 247, 255, 0.12);
      color: #c4fcff;
      border: 1px solid rgba(109, 247, 255, 0.35);
      border-radius: 999px;
      padding: 7px 15px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.93);
      background: rgba(109, 247, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="studio-backdrop"></div>
  <div class="cutting-mat"></div>
  <div class="ambient-vignette"></div>

  <div class="hint-text">Tap glass to feed · Double-tap to knock</div>

  <div class="prism-assembly">
    <div class="prism-glass" id="glassBox">
      <canvas id="tankCanvas"></canvas>
      <div class="bottom-led-glow"></div>
      <div class="prism-reflection"></div>
    </div>

    <div class="stand-unit">
      <div class="stand-lid"></div>
      <div class="stand-body">
        <div class="status-dot"></div>
      </div>
      <div class="stand-legs">
        <div class="leg"></div>
        <div class="leg"></div>
      </div>
    </div>
    <div class="stand-shadow"></div>
  </div>

  <div class="controls-bar">
    <button class="btn" id="btnFeed">Feed</button>
    <button class="btn" id="btnColor">Glow</button>
    <button class="btn" id="btnSound">SFX: ON</button>
    <button class="btn" id="btnMode">Full</button>
  </div>

  <script>
    const canvas = document.getElementById("tankCanvas");
    const ctx = canvas.getContext("2d");
    const glassBox = document.getElementById("glassBox");

    let soundEnabled = true;
    let audioCtx = null;

    const themes = [
      { fish: "#5ceeff", glow: "#00d9ff", weed: "#43f59b", bubble: "#9ff6ff", food: "#ffe66d", led: "rgba(0, 225, 255, 0.65)" },
      { fish: "#6bff95", glow: "#1aff66", weed: "#29b677", bubble: "#b8ffd0", food: "#fff07c", led: "rgba(38, 255, 115, 0.6)" },
      { fish: "#ffbe55", glow: "#ff9900", weed: "#5ce09b", bubble: "#ffe2b0", food: "#70f3ff", led: "rgba(255, 175, 45, 0.6)" },
      { fish: "#ff7be5", glow: "#ff33cc", weed: "#4be8b0", bubble: "#ffc7f3", food: "#ffe66d", led: "rgba(255, 75, 215, 0.6)" }
    ];
    let themeIndex = 0;

    const sprite = {
      right: "><(((°>",
      left: "<°)))><",
      happyRight: "><(((^>",
      happyLeft: "<^)))><"
    };

    let fish = null;
    let bubbles = [];
    let foods = [];
    let weeds = [];

    function applyThemeLed() {
      document.documentElement.style.setProperty("--led-color", themes[themeIndex].led);
    }

    function resizeCanvas() {
      const rect = glassBox.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      initWeeds(rect.width, rect.height);
    }

    function initWeeds(w, h) {
      weeds = [];
      const count = Math.max(3, Math.floor(w / 72));
      for (let i = 0; i < count; i++) {
        weeds.push({
          x: (w / (count + 1)) * (i + 1) + (Math.random() - 0.5) * 16,
          segments: 4 + Math.floor(Math.random() * 3),
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function playBeep(freq = 620, duration = 0.06, type = "sine") {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function spawnBubble(x, y, char = null) {
      const chars = ["o", "°", "O", "."];
      bubbles.push({
        x: x + (Math.random() - 0.5) * 8,
        y: y,
        vy: 0.65 + Math.random() * 0.75,
        wobble: Math.random() * Math.PI * 2,
        char: char || chars[Math.floor(Math.random() * chars.length)]
      });
    }

    function dropFood(x, y) {
      const rect = glassBox.getBoundingClientRect();
      const foodChars = ["·", "*", "+", "•"];
      for (let i = 0; i < 3; i++) {
        foods.push({
          x: (x ?? rect.width * (0.25 + Math.random() * 0.5)) + (Math.random() - 0.5) * 20,
          y: (y ?? 24) + Math.random() * 10,
          vy: 0.35 + Math.random() * 0.25,
          char: foodChars[Math.floor(Math.random() * foodChars.length)]
        });
      }
      playBeep(540, 0.05, "triangle");
    }

    function bindSingleAction(element, callback, cooldown = 200) {
      let lastTrigger = 0;
      element.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const now = Date.now();
        if (now - lastTrigger < cooldown) return;
        lastTrigger = now;
        callback(e);
      });
    }

    bindSingleAction(document.getElementById("btnFeed"), () => dropFood(), 200);
    bindSingleAction(document.getElementById("btnColor"), () => {
      themeIndex = (themeIndex + 1) % themes.length;
      applyThemeLed();
      playBeep(660, 0.06, "sine");
    }, 200);
    bindSingleAction(document.getElementById("btnSound"), (e) => {
      soundEnabled = !soundEnabled;
      e.currentTarget.textContent = soundEnabled ? "SFX: ON" : "SFX: OFF";
      if (soundEnabled) playBeep(720, 0.06, "sine");
    }, 200);
    bindSingleAction(document.getElementById("btnMode"), (e) => {
      document.body.classList.toggle("fullscreen-mode");
      e.currentTarget.textContent = document.body.classList.contains("fullscreen-mode") ? "Stand" : "Full";
      setTimeout(resizeCanvas, 50);
    }, 250);

    let lastTapTime = 0;
    glassBox.addEventListener("pointerdown", (e) => {
      const rect = glassBox.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const now = Date.now();

      if (now - lastTapTime < 280) {
        fish.dir = fish.x < x ? -1 : 1;
        fish.vx = fish.dir * 2.1;
        spawnBubble(fish.x, fish.y - 6, "o");
        playBeep(920, 0.05, "square");
      } else {
        dropFood(x, y);
      }
      lastTapTime = now;
    });

    function updateAndDraw(time) {
      const rect = glassBox.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      const theme = themes[themeIndex];

      ctx.clearRect(0, 0, w, h);

      // Draw seaweed
      ctx.save();
      ctx.font = "bold 16px 'Courier New', monospace";
      ctx.fillStyle = theme.weed;
      ctx.shadowColor = theme.weed;
      ctx.shadowBlur = 10;
      ctx.textAlign = "center";

      weeds.forEach((weed) => {
        for (let s = 0; s < weed.segments; s++) {
          const sway = Math.sin(time * 0.0022 + weed.phase + s * 0.7) * (2 + s * 0.8);
          const char = (s + Math.floor(time * 0.002)) % 2 === 0 ? "(" : ")";
          ctx.fillText(char, weed.x + sway, h - 10 - s * 14);
        }
      });
      ctx.restore();

      // Draw food pellets
      ctx.save();
      ctx.font = "bold 14px 'Courier New', monospace";
      ctx.fillStyle = theme.food;
      ctx.shadowColor = theme.food;
      ctx.shadowBlur = 8;
      ctx.textAlign = "center";

      for (let i = foods.length - 1; i >= 0; i--) {
        const fd = foods[i];
        fd.y += fd.vy;
        fd.x += Math.sin(time * 0.005 + i) * 0.2;
        ctx.fillText(fd.char, fd.x, fd.y);
        if (fd.y > h - 12) {
          foods.splice(i, 1);
        }
      }
      ctx.restore();

      // Update & draw single fish
      let targetFood = null;
      let minDist = 160;
      foods.forEach((fd) => {
        const d = Math.hypot(fd.x - fish.x, fd.y - fish.y);
        if (d < minDist) {
          minDist = d;
          targetFood = fd;
        }
      });

      if (targetFood) {
        const dx = targetFood.x - fish.x;
        const dy = targetFood.y - fish.y;
        fish.dir = dx >= 0 ? 1 : -1;
        fish.vx += (dx / (minDist || 1)) * 0.08;
        fish.vy += (dy / (minDist || 1)) * 0.06;
        fish.vx = Math.max(-1.8, Math.min(1.8, fish.vx));
        fish.vy = Math.max(-1.2, Math.min(1.2, fish.vy));

        if (minDist < 18) {
          const idx = foods.indexOf(targetFood);
          if (idx > -1) foods.splice(idx, 1);
          fish.happyTimer = 45;
          spawnBubble(fish.x + fish.dir * 12, fish.y - 6, "o");
          playBeep(860, 0.05, "sine");
        }
      } else {
        const targetSpeed = fish.dir * 0.75;
        fish.vx += (targetSpeed - fish.vx) * 0.03;
        fish.vy *= 0.96;
        if (Math.random() < 0.004) {
          fish.dir *= -1;
        }
      }

      fish.x += fish.vx;
      fish.y += fish.vy + Math.sin(time * 0.003) * 0.22;

      const margin = 46;
      if (fish.x < margin) {
        fish.x = margin;
        fish.dir = 1;
        fish.vx = Math.abs(fish.vx);
      } else if (fish.x > w - margin) {
        fish.x = w - margin;
        fish.dir = -1;
        fish.vx = -Math.abs(fish.vx);
      }

      if (fish.y < 32) fish.y = 32;
      if (fish.y > h - 42) fish.y = h - 42;

      if (Math.random() < 0.007) {
        spawnBubble(fish.x + fish.dir * 16, fish.y - 4);
      }

      if (fish.happyTimer > 0) fish.happyTimer--;

      const isHappy = fish.happyTimer > 0;
      const text =
        fish.dir === 1
          ? isHappy ? sprite.happyRight : sprite.right
          : isHappy ? sprite.happyLeft : sprite.left;

      ctx.save();
      ctx.font = "bold 17px 'Courier New', monospace";
      ctx.fillStyle = theme.fish;
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = 14;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, fish.x, fish.y);
      ctx.restore();

      // Update & draw bubbles
      ctx.save();
      ctx.font = "bold 13px 'Courier New', monospace";
      ctx.fillStyle = theme.bubble;
      ctx.shadowColor = theme.glow;
      ctx.shadowBlur = 10;
      ctx.textAlign = "center";

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y -= b.vy;
        b.x += Math.sin(time * 0.006 + b.wobble) * 0.35;
        ctx.fillText(b.char, b.x, b.y);
        if (b.y < 14) {
          bubbles.splice(i, 1);
        }
      }
      ctx.restore();

      requestAnimationFrame(updateAndDraw);
    }

    window.addEventListener("resize", resizeCanvas);
    applyThemeLed();
    resizeCanvas();
    const initRect = glassBox.getBoundingClientRect();
    fish = {
      x: initRect.width * 0.5,
      y: initRect.height * 0.45,
      vx: -0.75,
      vy: 0,
      dir: -1,
      happyTimer: 0
    };
    spawnBubble(initRect.width * 0.55, initRect.height * 0.35, "o");
    requestAnimationFrame(updateAndDraw);
  </script>
</body>
</html>
